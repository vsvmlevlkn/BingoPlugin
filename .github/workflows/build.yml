name: Build BingoPlugin

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build with Maven
        run: cd BingoPlugin && mvn clean package -q

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BingoPlugin
          path: BingoPlugin/target/BingoPlugin-1.0.0.jar
